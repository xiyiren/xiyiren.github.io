<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>正在进入…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #5B6CF0, #7C5BF0);
    min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  .box { text-align: center; padding: 32px; }
  .spinner {
    width: 38px; height: 38px; margin: 0 auto 18px;
    border: 3px solid rgba(255,255,255,.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
  .sub { font-size: 13px; opacity: .85; line-height: 1.7; }
  .sub.error { opacity: .95; }
</style>
</head>
<body>
<div class="box">
  <div class="spinner"></div>
  <div class="title">正在进入聊天…</div>
  <div class="sub">首次加载稍慢，请稍候</div>
</div>
<script>
  // 从 current.json 读取当前隧道地址并跳转；URL 带时间戳防 GitHub Pages 缓存
  function go() {
    fetch('current.json?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.url && d.url.indexOf('http') === 0) {
          location.replace(d.url);
        } else {
          throw new Error('bad data');
        }
      })
      .catch(function () {
        // 本地电脑没开机或地址还没更新时，每 3 秒重试
        setTimeout(go, 3000);
      });
  }
  go();
</script>
</body>
</html>
